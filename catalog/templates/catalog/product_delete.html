{% extends 'catalog/base.html' %}

{% block title %}Удаление продукта - {{ object.name }}{% endblock %}

{% block content %}
<h2>Удаление продукта</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'catalog:product' object.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
