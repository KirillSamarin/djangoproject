{% extends 'catalog/base.html' %}

{% block title %}Добавление нового продукта{% endblock %}

{% block content %}
<h2>Добавление продукта</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mt-3">
        <button type="submit" class="btn btn-success">Добавить продукт</button>
        <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
