{% extends 'blogs/base.html' %}

{% block title %}Удаление статьи - {{ object.title }}{% endblock %}

{% block content %}
<h1>Удаление статьи</h1>
<div class="alert alert-warning">
    <p>Вы уверены, что хотите удалить статью "{{ object.title }}"?</p>
    <p>Это действие нельзя отменить.</p>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'blogs:article-detail' object.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
